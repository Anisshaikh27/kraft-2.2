services:
  # Backend Web Service
  - type: web
    name: kraft-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kraft-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  # Frontend Static Site
  - type: static
    name: kraft-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: kraft-backend
          property: host

databases:
  - name: kraft-db
    databaseName: kraft
    user: kraft_user
    plan: free
